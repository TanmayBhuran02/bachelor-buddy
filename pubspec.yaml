name: bachelor_buddy
description: "Bachelor Buddy - Your personal life manager. Track expenses, budget, tiffin, todos, and water intake."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.25.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1

  # Notifications
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1

  # Home screen widgets
  home_widget: ^0.7.0

  # Charts
  fl_chart: ^0.70.2

  # Typography
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  local_auth: ^2.3.0
  stream_transform: ^2.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.25.0

flutter:
  uses-material-design: true
